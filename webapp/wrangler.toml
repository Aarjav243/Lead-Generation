name = "leadflow"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]  # csv-parse needs Node's Buffer (leadgen-api.js CSV import)

# Static UI. Anything not under /api/ is served from here; /api/ hits the Worker.
[assets]
directory = "./public"
binding = "ASSETS"

# Real database, created 2026-08-16 (APAC). `wrangler dev` / `--local` still use
# the local SQLite copy in .wrangler/state and never read this id.
# binding stays "DB" — every query in the app is env.DB.prepare(...).
[[d1_databases]]
binding = "DB"
database_name = "leadflow"
database_id = "2c1673a4-936a-4a05-8f2d-4fdad0d6c49b"
